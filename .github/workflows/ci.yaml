name: "CI - AdventureGuideClassic"

# Checks only. Nothing here packages or publishes.
#
# These gates run on every push and deliberately do NOT run in main.yaml. A
# release has already been decided by the time a v*.*.* tag exists, and a lint
# nit -- or luarocks.org being unreachable -- is not a reason to fail a
# CurseForge upload that would otherwise be fine. Failing is free here and
# expensive there, so the gate lives here.
on:
  push:
    branches: ["**"]
    # Tag pushes are the release workflow's business.
    tags-ignore: ["**"]

# A newer push makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Pinned, not `ubuntu-latest`: that label migrates to Ubuntu 26 on
    # 2026-10-19, and a gate that changes under you is worse than one a
    # release behind. Bump deliberately, with the run green first.
    runs-on: ubuntu-24.04
    # These gates take about a minute. Anything approaching this is stuck, not
    # slow. Sized to clear the per-step budgets below so it only fires as a
    # backstop for something they miss.
    timeout-minutes: 16
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up scripts
        run: chmod +x ./ci/scripts/lint.sh

      # The runner's own python3 is marked externally managed, so pip refuses
      # to install into it. setup-python provides one that does not.
      - name: Set up Python
        timeout-minutes: 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Lua and LuaRocks come from these actions rather than apt. In the sister
      # repo `apt-get update` hung silently for 48 minutes on one run -- not
      # failing, so no retry could beat it -- and took the lint gate with it.
      # Nothing here needs a system package, so nothing here uses apt.
      - name: Set up Lua
        timeout-minutes: 3
        uses: leafo/gh-actions-lua@v13
        with:
          # 5.4 is only what luacheck itself runs on; the addon is 5.1 and
          # .luacheckrc sets `std = "lua51"` to match.
          luaVersion: "5.4"

      - name: Set up LuaRocks
        timeout-minutes: 3
        uses: leafo/gh-actions-luarocks@v6

      - name: Lint
        timeout-minutes: 4
        run: |
          # luarocks.org is a network fetch, so it keeps a bounded retry: a
          # stalled host hangs rather than failing, and a bare `||` would wait
          # on it until the step budget ran out.
          retry() {
            for attempt in 1 2; do
              timeout 60 "$@" && return 0
              echo "attempt $attempt failed: $*"
              sleep 5
            done
            return 1
          }
          retry luarocks install luacheck
          ./ci/scripts/lint.sh

      # Every file setfenv's itself into a facade table that falls through to
      # _G, so a mistyped API name resolves to nil instead of raising. This is
      # what turns .luacheckrc from documentation into a typo catcher.
      - name: Check globals
        timeout-minutes: 4
        run: |
          python -m pip install --quiet luaparser
          python ci/scripts/check_globals.py

      # Loads all 141 addon files five times, once per client, and asserts what
      # each one sees. The step that catches a client-detection regression --
      # the 1.8.0 Forever bug produced nine failures here.
      #
      # lupa is installed rather than optional: the harness exits 0 when it is
      # missing, which is right on a developer's machine and useless in CI.
      - name: Smoke test
        timeout-minutes: 4
        run: |
          python -m pip install --quiet lupa
          python ci/tests/smoke_test.py
